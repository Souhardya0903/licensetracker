spring.application.name=licensetracker
spring.datasource.url=jdbc:mysql://localhost:3306/licensetracker?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
server.port=8080
jwt.secret=YourSuperSecretKeyThatIsAtLeast256BitsLongAndShouldBeStoredSecurely
jwt.expiration=3600000

# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-gmail-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Gemini and LangChain Configuration
gemini.api.key=${GEMINI_API_KEY}
gemini.api.model=gemini-2.0-flash
langchain.cache.enabled=true
langchain.cache.ttl=3600
