# Application Configuration
spring.application.name=licensetracker

# Server Configuration
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/licensetracker
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# For MySQL (uncomment for production)
#spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# H2 Console (for development only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT Configuration
jwt.secret=YourBase64EncodedSecretKeyHereMustBeAtLeast256BitsLongForHS256Algorithm
jwt.expiration=86400000

# Gemini AI Configuration
gemini.api.key=${GEMINI_API_KEY:YOUR_GEMINI_API_KEY}

# Logging Configuration
logging.level.root=INFO
logging.level.com.project=DEBUG
logging.level.org.springframework.security=DEBUG

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
